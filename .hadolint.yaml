failure-threshold: warning
no-fail: false

# Seuls les registres listés ici sont autorisés dans les FROM
trustedRegistries:
  - docker.io
  - gcr.io
  - cgr.dev
  - ghcr.io

override:
  error:
    # Règles de sécurité rehaussées en error
    - DL3002 # Le dernier USER ne doit pas être root
    - DL3006 # Toujours préciser explicitement la version de l'image
    - DL3007 # Interdiction de :latest sans épinglage
    - DL4006 # Définir SHELL avec -o pipefail avant tout RUN contenant un pipe

  warning:
    # Règles standards appliquées sans dérogation
    - DL3025 # Forme JSON exec pour CMD et ENTRYPOINT
    - DL3042 # pip install --no-cache-dir
    - DL3020 # COPY au lieu de ADD
    - DL3022 # COPY --from doit référencer un alias d'étage défini avant
    - DL3003 # WORKDIR au lieu de cd
    - SC2086 # Mettre les variables entre guillemets
    - SC2164 # cd ... || exit

# Aucune règle n'est ignorée
ignored: []
